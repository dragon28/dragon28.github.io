name: research-radar
# Weekly science-news digest: runs the n8n workflow from dragon28/research-radar
# on a GitHub runner and opens a PR with the post. Nothing is published until the PR is merged.
on:
  schedule:
    - cron: "0 22 * * 0"   # Sunday 22:00 UTC (Monday 06:00 +08) = end of the ISO week
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency: research-radar
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: dragon28/research-radar, path: radar }
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: restore dedup state (radar-state branch)
        run: |
          mkdir -p radar/data
          if git fetch -q origin radar-state; then
            git show origin/radar-state:radar.sqlite > radar/data/radar.sqlite
          fi
      - name: install
        working-directory: radar
        run: |
          uv sync
          cd n8n && npm ci --no-audit --no-fund && npm rebuild sqlite3
      - name: run n8n workflow against live feeds
        working-directory: radar
        run: |
          set -o pipefail
          uv run radar serve > serve.log 2>&1 &
          for i in $(seq 30); do curl -sf http://127.0.0.1:8765/health && break; sleep 1; done
          make n8n-import > /dev/null
          make n8n-run > n8n.log 2>&1 || { tail -50 n8n.log; cat serve.log; exit 1; }
          grep -q '"status": "success"' n8n.log
          tail -5 serve.log
          pkill -f 'radar serve' || true
          ls -l out/posts
      - name: save dedup state
        run: |
          d=$(mktemp -d); cp radar/data/radar.sqlite "$d/"
          cd "$d" && git init -q -b radar-state && git add radar.sqlite
          git -c user.name=research-radar-bot -c user.email=actions@github.com commit -qm "state $(date -u +%F)"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" radar-state
      - name: open PR with the draft post
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p _posts/research-radar
          cp radar/out/posts/*.md _posts/research-radar/ 2>/dev/null || true
          git add _posts/research-radar
          if git diff --cached --quiet; then echo "no new or changed post"; exit 0; fi
          f=$(git diff --cached --name-only | head -1); week=$(basename "$f" .md | grep -o 'w[0-9]*$')
          br="research-radar-$(date -u +%G)-$week"
          git -c user.name=research-radar-bot -c user.email=actions@github.com commit -qm "Research Radar: $week draft"
          git push -fq origin HEAD:"$br"
          gh pr view "$br" >/dev/null 2>&1 || gh pr create --draft --base gh-pages --head "$br" \
            --title "Research Radar: $week" \
            --body "Auto-generated by the n8n workflow on GitHub Actions. Skim the topic labels (keyword rules) before merging."
